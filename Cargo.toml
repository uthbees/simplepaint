[package]
name = "simplepaint"
version = "0.1.0"
edition = "2024"


[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

[dependencies]
arboard = "3.7.0"
bytemuck = "1.25.2"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", features = ["winit"] }
egui-winit = "0.37.0"
egui_dnd = "0.18.0"
egui_material_icons = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["default-formats"] }
pollster = "1.0.1"
rfd = "0.18.0"
tiny-skia = "0.12.0"
tinyfiledialogs = "3.9.1"
wgpu = "30.0.1"
winit = "0.30.13"
